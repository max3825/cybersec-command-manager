services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cybersec-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: cybersec_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cybersec-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: cybersec-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:secure_password@db:5432/cybersec_manager
      FLASK_ENV: development
      FLASK_DEBUG: 1
      SECRET_KEY: your-secret-key-change-me
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
      - ./logs:/app/logs
    networks:
      - cybersec-network
    command: >
      sh -c "
        echo '⏳ Attente de la base de données...' &&
        sleep 5 &&
        echo '📊 Création des tables...' &&
        python -c 'from app import app, db; app.app_context().push(); db.create_all(); print(\"✅ Tables créées\")' &&
        echo '📥 Import des données JSON...' &&
        python migrate_json_to_db.py || echo '⚠️ Import échoué ou déjà fait' &&
        echo '🚀 Démarrage de l application...' &&
        python app.py
      "

  # PgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cybersec-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - cybersec-network

volumes:
  postgres_data:
    driver: local

networks:
  cybersec-network:
    driver: bridge
