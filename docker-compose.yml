services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cybersec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-cybersec_manager}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cybersec-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Application
  web:
    build: .
    container_name: cybersec-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-cybersec_manager}
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:-changeme}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      #- ./app:/app
      - ./logs:/app/logs
      - app_data:/app/data
    networks:
      - cybersec-network
    command: >
      sh -c "
        echo '⏳ Attente de la base de données...' &&
        sleep 5 &&
        echo '📊 Création des tables...' &&
        python -c 'from app import app, db; app.app_context().push(); db.create_all(); print(\"✅ Tables créées\")' &&
        echo '📥 Import des données JSON...' &&
        python migrate_json_to_db.py || echo '⚠️ Import échoué ou déjà effectué' &&
        echo '🚀 Démarrage de l application Flask...' &&
        python app.py
      "

  # PgAdmin (Database Management UI) - VERSION CORRIGÉE
  

volumes:
  postgres_data:
    driver: local
  app_data:
    driver: local

networks:
  cybersec-network:
    driver: bridge
